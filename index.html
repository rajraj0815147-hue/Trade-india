<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Investment Plan Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0b071e;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #180e38;
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 450px;
      border: 1px solid #331d68;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 {
      margin-bottom: 20px;
      color: #ffab00;
      text-align: center;
    }
    .input-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #b2a8d9;
    }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #3d2475;
      background-color: #0c061f;
      color: #fff;
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: #7c4dff;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      background-color: #7c4dff;
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #5e35b1;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background: #0c061f;
      border-radius: 6px;
      border: 1px solid #2d1859;
      display: none;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
    .result-item:last-child {
      margin-bottom: 0;
      padding-top: 8px;
      border-top: 1px solid #331d68;
      font-weight: bold;
      color: #00c853;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Investment Plan</h2>
    
    <div class="input-group">
      <label for="principal">Initial Investment (₹)</label>
      <input type="number" id="principal" placeholder="e.g. 10000">
    </div>

    <div class="input-group">
      <label for="rate">Expected Return (% per year)</label>
      <input type="number" id="rate" placeholder="e.g. 12" step="0.1">
    </div>

    <div class="input-group">
      <label for="years">Duration (Years)</label>
      <input type="number" id="years" placeholder="e.g. 5">
    </div>

    <button onclick="calculateReturn()">Calculate Returns</button>

    <div class="result" id="resultBox">
      <div class="result-item">
        <span>Invested Amount:</span>
        <span id="investedAmt">₹0</span>
      </div>
      <div class="result-item">
        <span>Estimated Profit:</span>
        <span id="profitAmt">₹0</span>
      </div>
      <div class="result-item">
        <span>Total Value:</span>
        <span id="totalAmt">₹0</span>
      </div>
    </div>
  </div>

  <script>
    function calculateReturn() {
      const P = parseFloat(document.getElementById('principal').value);
      const R = parseFloat(document.getElementById('rate').value);
      const N = parseFloat(document.getElementById('years').value);

      if (isNaN(P) || isNaN(R) || isNaN(N) || P <= 0 || R <= 0 || N <= 0) {
        alert("Kripya sahi number bharein.");
        return;
      }

      const total = P * Math.pow((1 + R / 100), N);
      const profit = total - P;

      document.getElementById('investedAmt').innerText = '₹' + P.toLocaleString('en-IN', {maximumFractionDigits: 0});
      document.getElementById('profitAmt').innerText = '₹' + Math.round(profit).toLocaleString('en-IN');
      document.getElementById('totalAmt').innerText = '₹' + Math.round(total).toLocaleString('en-IN');

      document.getElementById('resultBox').style.display = 'block';
    }
  </script>

</body>
</html>
